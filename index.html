<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐语道 Joy Language · 约课系统</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: linear-gradient(145deg, #fef7f0 0%, #fce4d6 100%);
        }

        /* ===== 主卡片 ===== */
        .booking-card {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 45px 40px 50px;
            box-shadow: 0 30px 80px rgba(200, 120, 60, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        .booking-card:hover {
            box-shadow: 0 40px 100px rgba(200, 120, 60, 0.2);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .header-icon {
            font-size: 34px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #4a2c1a;
            letter-spacing: -0.5px;
        }

        .header .sub-brand {
            font-size: 1rem;
            color: #b8865b;
            font-weight: 400;
            margin-left: 4px;
        }

        .subhead {
            color: #8a6d4e;
            font-size: 1rem;
            margin-bottom: 24px;
            padding-left: 48px;
            border-left: 3px solid #e8c4a0;
            padding-left: 18px;
        }

        /* ===== 课程选择 ===== */
        .course-selector {
            margin-bottom: 28px;
        }

        .course-selector label {
            display: block;
            font-weight: 600;
            color: #4a2c1a;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .course-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .course-option {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid #f0e0d0;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .course-option:hover {
            border-color: #dba87a;
            background: #fdf8f3;
        }

        .course-option input[type="radio"] {
            accent-color: #c28a5c;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .course-option .price-tag {
            color: #c28a5c;
            font-weight: 600;
            font-size: 0.85rem;
            background: #f5ede6;
            padding: 2px 12px;
            border-radius: 20px;
            white-space: nowrap;
            margin-left: 8px;
        }

        .course-option .course-label {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .course-option .badge {
            font-size: 0.7rem;
            background: #e8c4a0;
            color: #4a2c1a;
            padding: 0 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* ===== 表单区域 ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #4a2c1a;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: #d9465b;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid #f0e0d0;
            background: white;
            font-size: 1rem;
            transition: border 0.25s, box-shadow 0.25s;
            outline: none;
            color: #1f1a2a;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #c28a5c;
            box-shadow: 0 0 0 4px rgba(194, 138, 92, 0.12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .datetime-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ===== 预约按钮 ===== */
        .btn-book {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #c28a5c, #a87048);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 10px 30px rgba(194, 138, 92, 0.3);
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(194, 138, 92, 0.4);
        }

        .btn-book:active {
            transform: scale(0.97);
        }

        .btn-book:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 成功提示 ===== */
        .success-message {
            display: none;
            background: #e6f7e6;
            border-radius: 20px;
            padding: 20px 24px;
            margin-top: 20px;
            color: #0b5e2e;
            font-weight: 500;
            border-left: 6px solid #22c55e;
            align-items: center;
            gap: 12px;
        }

        .success-message.show {
            display: flex;
        }

        .success-message span {
            font-size: 1.5rem;
        }

        /* ===== 错误提示 ===== */
        .error-message {
            display: none;
            background: #fde8e8;
            border-radius: 20px;
            padding: 16px 20px;
            margin-top: 16px;
            color: #a11f1f;
            border-left: 6px solid #ef4444;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 24px;
            text-align: center;
            color: #b09078;
            font-size: 0.85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .booking-card {
                padding: 28px 18px 35px;
                border-radius: 32px;
            }
            .form-row, .datetime-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .course-options {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .course-option {
                font-size: 0.9rem;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <!-- 头部 -->
        <div class="header">
            <span class="header-icon">🌍</span>
            <div>
                <h1>乐语道 <span class="sub-brand">Joy Language</span></h1>
            </div>
        </div>
        <div class="subhead">选择课程 · 预约你的专属语言时光 ✨</div>

        <!-- ===== 课程选择 ===== -->
        <div class="course-selector">
            <label>📚 选择课程 <span class="required">*</span></label>
            <div class="course-options" id="courseOptions">
                <label class="course-option">
                    <span class="course-label">🧒 少儿基础课 <span class="badge">1.5h</span></span>
                    <span class="price-tag">¥450/节</span>
                    <input type="radio" name="course" value="少儿基础课 (¥450/节)" checked />
                </label>
                <label class="course-option">
                    <span class="course-label">📖 少儿A1 <span class="badge">1.5h</span></span>
                    <span class="price-tag">¥480/节</span>
                    <input type="radio" name="course" value="少儿A1 (¥480/节)" />
                </label>
                <label class="course-option">
                    <span class="course-label">🧑 成人基础课 <span class="badge">月卡</span></span>
                    <span class="price-tag">月卡</span>
                    <input type="radio" name="course" value="成人基础课 (月卡)" />
                </label>
                <label class="course-option">
                    <span class="course-label">📈 成人进阶课 <span class="badge">月卡</span></span>
                    <span class="price-tag">月卡</span>
                    <input type="radio" name="course" value="成人进阶课 (月卡)" />
                </label>
                <label class="course-option">
                    <span class="course-label">🗣️ 西班牙语语音课 <span class="badge">班课</span></span>
                    <span class="price-tag">班课</span>
                    <input type="radio" name="course" value="西班牙语语音课 (班课)" />
                </label>
                <label class="course-option">
                    <span class="course-label">🇪🇸 西班牙语A1 <span class="badge">班课</span></span>
                    <span class="price-tag">班课</span>
                    <input type="radio" name="course" value="西班牙语A1 (班课)" />
                </label>
            </div>
        </div>

        <!-- ===== 预约表单 ===== -->
        <form id="bookingForm" onsubmit="handleSubmit(event)">

            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span class="required">*</span></label>
                    <input type="text" id="studentName" placeholder="如：张明明" required />
                </div>
                <div class="form-group">
                    <label>手机号 <span class="required">*</span></label>
                    <input type="tel" id="studentPhone" placeholder="138-0000-0000" required />
                </div>
            </div>

            <div class="datetime-grid">
                <div class="form-group">
                    <label>📆 日期 <span class="required">*</span></label>
                    <input type="date" id="lessonDate" required />
                </div>
                <div class="form-group">
                    <label>⏰ 时段 (1.5h) <span class="required">*</span></label>
                    <select id="lessonTime" required>
                        <option value="">— 请选择 —</option>
                        <option value="15:00-16:30">15:00 – 16:30</option>
                        <option value="16:30-18:00">16:30 – 18:00</option>
                        <option value="18:00-19:30">18:00 – 19:30</option>
                        <option value="19:30-21:00">19:30 – 21:00</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>📝 备注（可选）</label>
                <input type="text" id="lessonNote" placeholder="如：我想了解少儿基础课的内容" />
            </div>

            <button type="submit" class="btn-book" id="submitBtn">✅ 确认预约</button>
        </form>

        <!-- 成功提示 -->
        <div class="success-message" id="successMsg">
            <span>🎉</span>
            <div>
                <strong>预约成功！</strong><br />
                乐语道 Joy Language 将在 24 小时内与你联系确认。
            </div>
        </div>

        <!-- 错误提示 -->
        <div class="error-message" id="errorMsg">
            ⚠️ 通知发送失败，但预约已记录。请稍后联系老师确认。
        </div>

        <div class="footer-note">⏳ 每时段仅限 4 人 · 预约后请按时出席 · 1.5 小时/节</div>
    </div>

    <script>
        // ============================================================
        //  ★★★ 在这里替换成你自己的钉钉机器人 Webhook 地址 ★★★
        // ============================================================
        const DINGTALK_WEBHOOK = 'https://oapi.dingtalk.com/robot/send?access_token=你的钉钉机器人Token';

        // ============================================================
        //  1. 设置默认日期为「明天」
        // ============================================================
        (function setDefaultDate() {
            const dateInput = document.getElementById('lessonDate');
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const year = tomorrow.getFullYear();
            const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const day = String(tomorrow.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;
            const today = new Date();
            const tYear = today.getFullYear();
            const tMonth = String(today.getMonth() + 1).padStart(2, '0');
            const tDay = String(today.getDate()).padStart(2, '0');
            dateInput.min = `${tYear}-${tMonth}-${tDay}`;
        })();

        // ============================================================
        //  2. 表单提交处理（含钉钉推送）
        // ============================================================
        function handleSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const date = document.getElementById('lessonDate').value;
            const time = document.getElementById('lessonTime').value;
            const note = document.getElementById('lessonNote').value.trim();

            // 获取选中的课程
            const selectedCourse = document.querySelector('input[name="course"]:checked');
            const course = selectedCourse ? selectedCourse.value : '未选择';

            // 校验
            if (!name || !phone || !date || !time) {
                alert('请完整填写姓名、手机号、日期和时段 😊');
                return;
            }
            const phoneClean = phone.replace(/-/g, '');
            if (!/^\d{11}$/.test(phoneClean)) {
                alert('请输入有效的 11 位手机号（如 13800000000）');
                return;
            }

            // 禁用按钮，防止重复提交
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 发送中...';

            // 隐藏旧的提示
            document.getElementById('successMsg').classList.remove('show');
            document.getElementById('errorMsg').classList.remove('show');

            // ============================================================
            //  3. 发送到钉钉机器人
            // ============================================================
            const message = {
                "msgtype": "text",
                "text": {
                    "content": `🌍 乐语道 Joy Language · 新预约通知\n\n` +
                               `📚 课程：${course}\n` +
                               `👤 姓名：${name}\n` +
                               `📱 电话：${phone}\n` +
                               `📆 日期：${date}\n` +
                               `⏰ 时段：${time}\n` +
                               `📝 备注：${note || '无'}\n\n` +
                               `🕐 预约时间：${new Date().toLocaleString('zh-CN')}`
                }
            };

            fetch(DINGTALK_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
            })
            .then(res => res.json())
            .then(data => {
                console.log('📩 钉钉推送结果：', data);
                if (data.errcode === 0) {
                    // 显示成功
                    document.getElementById('successMsg').classList.add('show');
                    document.getElementById('successMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    btn.disabled = false;
                    btn.textContent = '✅ 预约成功！';
                } else {
                    // 钉钉返回了错误码
                    console.error('钉钉推送错误：', data);
                    document.getElementById('errorMsg').classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '✅ 确认预约';
                }
            })
            .catch(err => {
                console.error('请求失败：', err);
                document.getElementById('errorMsg').classList.add('show');
                btn.disabled = false;
                btn.textContent = '✅ 确认预约';
                // 数据保留在控制台
                console.log('📦 预约数据（请手动记录）：', { course, name, phone, date, time, note });
            });
        }

        // ============================================================
        //  4. 点击提示可关闭
        // ============================================================
        document.getElementById('successMsg').addEventListener('click', function() {
            this.classList.remove('show');
            const btn = document.getElementById('submitBtn');
            btn.textContent = '✅ 确认预约';
        });
        document.getElementById('errorMsg').addEventListener('click', function() {
            this.classList.remove('show');
            const btn = document.getElementById('submitBtn');
            btn.textContent = '✅ 确认预约';
        });
    </script>

</body>
</html>
