<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>约课系统 · 轻松预约</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: linear-gradient(145deg, #f7f0fc 0%, #e9def0 100%);
        }

        /* ===== 主卡片 ===== */
        .booking-card {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 45px 40px 50px;
            box-shadow: 0 30px 80px rgba(90, 50, 130, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        .booking-card:hover {
            box-shadow: 0 40px 100px rgba(90, 50, 130, 0.25);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .header-icon {
            font-size: 34px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d1b3d;
            letter-spacing: -0.5px;
        }

        .subhead {
            color: #6b5a7a;
            font-size: 1rem;
            margin-bottom: 30px;
            padding-left: 48px;
            border-left: 3px solid #b8a0cc;
            padding-left: 18px;
        }

        /* ===== 课程信息条 ===== */
        .course-info {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 24px;
            padding: 18px 24px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
        }

        .course-name {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .course-price {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        /* ===== 表单区域 ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d1b3d;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: #d9465b;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid #e5dced;
            background: white;
            font-size: 1rem;
            transition: border 0.25s, box-shadow 0.25s;
            outline: none;
            color: #1f1a2a;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ===== 日期 & 时段（视觉增强） ===== */
        .datetime-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ===== 预约按钮 ===== */
        .btn-book {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3);
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(124, 58, 237, 0.4);
        }

        .btn-book:active {
            transform: scale(0.97);
        }

        /* ===== 成功提示（默认隐藏） ===== */
        .success-message {
            display: none;
            background: #e6f7e6;
            border-radius: 20px;
            padding: 20px 24px;
            margin-top: 20px;
            color: #0b5e2e;
            font-weight: 500;
            border-left: 6px solid #22c55e;
            align-items: center;
            gap: 12px;
        }

        .success-message.show {
            display: flex;
        }

        .success-message span {
            font-size: 1.5rem;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 24px;
            text-align: center;
            color: #9a8aa8;
            font-size: 0.85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .booking-card {
                padding: 30px 20px 35px;
                border-radius: 32px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .datetime-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .course-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <!-- 头部 -->
        <div class="header">
            <span class="header-icon">📅</span>
            <h1>预约课程</h1>
        </div>
        <div class="subhead">选择你方便的时间，轻松完成约课</div>

        <!-- 课程信息 -->
        <div class="course-info">
            <span class="course-name">🎹 钢琴一对一 · 精品课</span>
            <span class="course-price">¥280 / 节</span>
        </div>

        <!-- ===== 预约表单 ===== -->
        <form id="bookingForm" onsubmit="handleSubmit(event)">

            <!-- 姓名 + 电话（同一行） -->
            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span class="required">*</span></label>
                    <input type="text" id="studentName" placeholder="如：张明明" required />
                </div>
                <div class="form-group">
                    <label>手机号 <span class="required">*</span></label>
                    <input type="tel" id="studentPhone" placeholder="138-0000-0000" required />
                </div>
            </div>

            <!-- 日期 + 时段（同一行） -->
            <div class="datetime-grid">
                <div class="form-group">
                    <label>📆 日期 <span class="required">*</span></label>
                    <input type="date" id="lessonDate" required />
                </div>
                <div class="form-group">
                    <label>⏰ 时段 <span class="required">*</span></label>
                    <select id="lessonTime" required>
                        <option value="">— 请选择 —</option>
                        <option value="09:00-10:00">09:00 – 10:00</option>
                        <option value="10:30-11:30">10:30 – 11:30</option>
                        <option value="14:00-15:00">14:00 – 15:00</option>
                        <option value="15:30-16:30">15:30 – 16:30</option>
                        <option value="19:00-20:00">19:00 – 20:00</option>
                    </select>
                </div>
            </div>

            <!-- 备注（可选） -->
            <div class="form-group">
                <label>📝 备注（可选）</label>
                <input type="text" id="lessonNote" placeholder="如：我想学《致爱丽丝》" />
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="btn-book">✅ 确认预约</button>
        </form>

        <!-- 成功提示 -->
        <div class="success-message" id="successMsg">
            <span>🎉</span>
            <div>
                <strong>预约成功！</strong><br />
                我们将在 30 分钟内与你确认具体安排。
            </div>
        </div>

        <div class="footer-note">⏳ 每时段仅限 1 人 · 预约后请按时出席</div>
    </div>

    <script>
        // ============================================================
        //  1. 设置默认日期为「明天」（避免用户选今天已过的时段）
        // ============================================================
        (function setDefaultDate() {
            const dateInput = document.getElementById('lessonDate');
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const year = tomorrow.getFullYear();
            const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const day = String(tomorrow.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;
            const today = new Date();
            const tYear = today.getFullYear();
            const tMonth = String(today.getMonth() + 1).padStart(2, '0');
            const tDay = String(today.getDate()).padStart(2, '0');
            dateInput.min = `${tYear}-${tMonth}-${tDay}`;
        })();

        // ============================================================
        //  2. 表单提交处理
        // ============================================================
        function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const date = document.getElementById('lessonDate').value;
            const time = document.getElementById('lessonTime').value;
            const note = document.getElementById('lessonNote').value.trim();

            if (!name || !phone || !date || !time) {
                alert('请完整填写姓名、手机号、日期和时段 😊');
                return;
            }
            const phoneClean = phone.replace(/-/g, '');
            if (!/^\d{11}$/.test(phoneClean)) {
                alert('请输入有效的 11 位手机号（如 13800000000）');
                return;
            }

            const bookingData = {
                student: name,
                phone: phone,
                date: date,
                time: time,
                note: note || '（无）',
                bookedAt: new Date().toLocaleString('zh-CN')
            };

            console.log('📩 新预约数据：', bookingData);

            const successEl = document.getElementById('successMsg');
            successEl.classList.add('show');
            successEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const btn = document.querySelector('.btn-book');
            btn.disabled = true;
            btn.textContent = '⏳ 已预约，等待确认...';
            btn.style.opacity = '0.7';
        }

        document.getElementById('successMsg').addEventListener('click', function() {
            this.classList.remove('show');
            const btn = document.querySelector('.btn-book');
            btn.disabled = false;
            btn.textContent = '✅ 确认预约';
            btn.style.opacity = '1';
        });
    </script>

</body>
</html>
